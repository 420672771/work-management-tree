<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>联合利丰 · 工作管理树登录</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fb;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;color:#203954;min-height:100vh;display:grid;place-items:center;padding:24px}.login-shell{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;border:1px solid #dde6f2;border-radius:20px;overflow:hidden;box-shadow:0 24px 80px #12335b13;background:#fff}.brand{padding:44px 40px;color:#fff;background:linear-gradient(145deg,#13365e,#245ba1);display:flex;flex-direction:column;justify-content:flex-start}.brand h1{font-size:30px;margin:0 0 10px;letter-spacing:1px}.brand p{color:#cbdcf3}.company-brand{flex-shrink:0;margin-bottom:0}.brand-copy{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0 64px}.brand-copy p{margin:12px 0}.brand-copy p:last-child{margin-top:24px}.company-logo{display:block;width:152px;max-width:100%;height:auto}.brand .company-name{font-size:12px;letter-spacing:.5px;color:#cbdcf3;margin:10px 0 0}.login-card{padding:44px 36px}.login-card h2{margin:0 0 6px;font-size:25px}.muted{font-size:13px;color:#72849a}label{display:block;margin:18px 0 7px;font-weight:500}input,button{width:100%;font:inherit;border-radius:8px;padding:11px 13px}input{border:1px solid #d8e2ef;background:#fbfcff}input:focus{outline:2px solid #c7d9fc;border-color:#467bd2}button{border:0;background:#245dcc;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:default}form button{margin-top:24px}.divider{text-align:center;margin:22px 0;color:#8d9bae;font-size:12px;display:flex;align-items:center;gap:12px}.divider:before,.divider:after{content:'';height:1px;background:#e3eaf3;flex:1}.secondary{background:#f2f6fc;color:#315685;border:1px solid #dce5f2}.status{min-height:24px;color:#bc3030;font-size:13px;margin:12px 0 0}.demo-link{display:block;text-align:center;color:#416897;margin-top:18px;font-size:13px}a{color:#245dcc}[hidden]{display:none!important}@media(max-width:640px){.login-shell{grid-template-columns:1fr;max-width:440px}.brand{padding:25px 30px}.company-brand{margin-bottom:22px}.brand-copy{flex:none;padding:0}.brand-copy p{margin:4px 0}.brand-copy p:last-child{margin-top:10px}.company-logo{width:136px}.brand .company-name{font-size:11px;letter-spacing:.3px;margin-top:8px}.brand h1{font-size:23px}.brand p{margin:4px 0}.login-card{padding:28px}}
</style></head><body><main class="login-shell"><section class="brand"><div class="company-brand"><img class="company-logo" src="/static/brand/unifortune-logo.png?v=20261106-1" alt="联合利丰 UNIFORTUNE" width="176" height="50"><p class="company-name">联合利丰供应链股份有限公司</p></div><div class="brand-copy"><h1>工作管理树</h1><p>科技产品中心</p><p>连接团队责任、任务进展与工作成果。</p></div></section><section class="login-card"><h2>欢迎登录</h2><p class="muted">使用员工账号，或通过已绑定的飞书账号登录。</p><form id="loginForm"><label for="loginName">账号</label><input id="loginName" autocomplete="username" required maxlength="64" placeholder="请输入登录账号"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password" required maxlength="128" placeholder="请输入密码"><button id="loginSubmit" type="submit">登录</button></form><p id="loginStatus" class="status" role="status" aria-live="polite"></p><div class="divider">或使用飞书</div><button id="feishuLogin" class="secondary" type="button" disabled>飞书扫码登录</button><p id="feishuHint" class="muted"></p><p class="muted">忘记密码？请联系部门负责人或管理 PM 重置。</p><a id="demoLink" class="demo-link" href="/" hidden>返回测试环境，使用演示身份</a></section></main><script src="/static/feishu-login.js?v=20261110-qr-first1"></script><script>
const $=s=>document.querySelector(s),messages={expired:'扫码已过期，请重新尝试。',unbound:'此飞书账号尚未绑定员工，请先用账号密码登录，在个人中心扫码绑定。',not_configured:'飞书网页登录尚未完成回调配置，请先使用账号密码。',authorization_failed:'飞书授权未完成，请重试。',cancelled:'已取消飞书授权，可重新扫码或使用账号密码。'};
$('#loginStatus').textContent=messages[new URLSearchParams(location.search).get('login_error')]||'';
fetch('/api/auth/options',{cache:'no-store'}).then(r=>r.json()).then(state=>{$('#feishuLogin').disabled=!state.feishu_ready;$('#feishuHint').textContent=state.feishu_ready?'绑定飞书后，可直接扫码进入工作台。':'飞书网页登录尚未完成配置。';$('#demoLink').hidden=!state.demo_enabled;}).catch(()=>$('#loginStatus').textContent='无法获取登录配置，请刷新重试。');
$('#feishuLogin').onclick=()=>openFeishuQr('login');
$('#loginForm').onsubmit=async event=>{event.preventDefault();$('#loginSubmit').disabled=true;$('#loginStatus').textContent='正在登录…';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#loginName').value.trim(),password:$('#loginPassword').value})}),data=await response.json();if(!response.ok)throw new Error(data.error||'登录失败');$('#loginPassword').value='';location.assign('/');}catch(error){$('#loginStatus').textContent=error.message;}finally{$('#loginSubmit').disabled=false;}};
</script></body></html>
