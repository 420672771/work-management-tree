<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="AI任务草稿核对与编辑界面示意">
<rect width="1200" height="610" rx="18" fill="#f4f7fc"/><rect x="54" y="35" width="1092" height="540" rx="18" fill="#f8fbff" stroke="#a9c9f5"/><g font-family="Microsoft YaHei,sans-serif"><text x="92" y="86" fill="#2864d7" font-size="20" font-weight="700">AI 提炼的任务草稿</text><text x="92" y="132" fill="#173963" font-size="29" font-weight="700">与对口业务部门召开创签约协调会</text><rect x="1000" y="62" width="104" height="46" rx="23" fill="#e8f1ff"/><text x="1021" y="91" fill="#2864d7" font-size="16" font-weight="700">编辑 ✎</text><g fill="#6d7d93" font-size="16"><text x="92" y="185">任务责任人</text><text x="412" y="185">截止日期</text><text x="92" y="278">建议责任域</text><text x="412" y="278">优先级</text><text x="92" y="371">任务详情</text><text x="92" y="478">交付物 / 验收标准</text></g><g fill="#183b70" font-size="22" font-weight="700"><text x="92" y="222">钱缘</text><text x="412" y="222">2026/11/04</text><text x="92" y="315">Agent 应用交付域</text><text x="412" y="315">P1</text></g><rect x="92" y="390" width="970" height="60" rx="9" fill="#fff" stroke="#d6e1f0"/><text x="112" y="427" fill="#3f5069" font-size="17">协调业务部门推进创签约，组织与对口业务部门召开沟通会。</text><rect x="92" y="497" width="970" height="48" rx="9" fill="#fff" stroke="#d6e1f0"/><text x="112" y="528" fill="#98a7b9" font-size="16">可补充验收标准，例如：会议纪要与行动项清单</text><text x="714" y="279" fill="#6d7d93" font-size="16">任务类型</text><text x="714" y="315" fill="#183b70" font-size="22" font-weight="700">专项任务</text></g></svg>
