<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="手工创建任务界面示意">
<rect width="1200" height="650" rx="18" fill="#f4f7fc"/><rect x="55" y="38" width="1090" height="574" rx="18" fill="#fff" stroke="#dbe5f3"/><g font-family="Microsoft YaHei,sans-serif"><text x="92" y="90" fill="#163763" font-size="27" font-weight="700">创建任务</text><path d="M92 108h45" stroke="#3977e3" stroke-width="5" stroke-linecap="round"/><text x="92" y="152" fill="#526782" font-size="15">用于明确、简单的待办；只需填写四项必填信息。</text><text x="92" y="205" fill="#3d506b" font-size="17" font-weight="700">任务标题 *</text><rect x="92" y="221" width="1015" height="52" rx="9" fill="#fff" stroke="#cfdbea"/><text x="112" y="254" fill="#91a0b4" font-size="16">例如：完成采购审批 Agent 试点方案评审</text><text x="92" y="325" fill="#3d506b" font-size="17" font-weight="700">挂载责任域 *</text><text x="447" y="325" fill="#3d506b" font-size="17" font-weight="700">责任人 *</text><text x="802" y="325" fill="#3d506b" font-size="17" font-weight="700">截止日期 *</text><g fill="#fff" stroke="#cfdbea"><rect x="92" y="342" width="310" height="57" rx="9"/><rect x="447" y="342" width="310" height="57" rx="9"/><rect x="802" y="342" width="305" height="57" rx="9"/></g><g fill="#3d506b" font-size="16"><text x="113" y="377">Agent 应用交付域</text><text x="468" y="377">钱缘</text><text x="823" y="377">2026 / 11 / 04</text></g><g fill="#7a8aa0" font-size="18"><text x="374" y="377">⌄</text><text x="729" y="377">⌄</text><text x="1073" y="377">▣</text></g><rect x="92" y="430" width="1015" height="52" rx="10" fill="#f7f9fd" stroke="#dbe5f3"/><text x="112" y="463" fill="#526782" font-size="17" font-weight="700">更多信息</text><text x="1071" y="464" fill="#2e6bdb" font-size="27">+</text><rect x="92" y="518" width="147" height="56" rx="10" fill="#2864d7"/><text x="116" y="554" fill="#fff" font-size="19" font-weight="700">创建任务</text><g font-size="14" font-weight="700"><circle cx="73" cy="247" r="15" fill="#2864d7"/><text x="68" y="252" fill="#fff">1</text><circle cx="73" cy="370" r="15" fill="#2864d7"/><text x="68" y="375" fill="#fff">2</text><circle cx="73" cy="546" r="15" fill="#2864d7"/><text x="68" y="551" fill="#fff">3</text></g></g></svg>
