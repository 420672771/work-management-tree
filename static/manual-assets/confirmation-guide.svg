<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="任务确认和验收界面示意">
<rect width="1200" height="540" rx="18" fill="#f4f7fc"/><g font-family="Microsoft YaHei,sans-serif"><text x="52" y="56" fill="#163763" font-size="26" font-weight="700">确认中心 · 任务闭环操作</text><text x="52" y="86" fill="#6f8096" font-size="15">任务、进度和验收都在这里完成“上级确认”。</text><rect x="52" y="119" width="1096" height="130" rx="14" fill="#fff" stroke="#dbe5f3"/><rect x="52" y="119" width="6" height="130" rx="3" fill="#f0a71b"/><text x="80" y="156" fill="#233b5c" font-size="20" font-weight="700">① 新建任务待确认</text><text x="80" y="187" fill="#687b92" font-size="16">责任人：钱缘　截止：2026/11/04　责任域：Agent 应用交付域</text><rect x="922" y="175" width="86" height="42" rx="8" fill="#2864d7"/><text x="945" y="202" fill="#fff" font-size="16" font-weight="700">确认</text><rect x="1022" y="175" width="86" height="42" rx="8" fill="#fff" stroke="#d7e1ee"/><text x="1046" y="202" fill="#526782" font-size="16">驳回</text><path d="M600 265v35" stroke="#7795c1" stroke-width="3"/><path d="M592 291l8 10 8-10" fill="none" stroke="#7795c1" stroke-width="3"/><rect x="52" y="319" width="526" height="160" rx="14" fill="#fff" stroke="#dbe5f3"/><rect x="52" y="319" width="6" height="160" rx="3" fill="#2e84ba"/><text x="80" y="358" fill="#233b5c" font-size="19" font-weight="700">② 责任人：填报进度 / 提交验收</text><text x="80" y="391" fill="#687b92" font-size="16">“完成 80%，阻塞：等待业务确认”</text><text x="80" y="421" fill="#687b92" font-size="16">完成后补充交付物，再提交验收</text><rect x="80" y="438" width="116" height="30" rx="7" fill="#e8f1ff"/><text x="99" y="460" fill="#2864d7" font-size="14" font-weight="700">提交验收</text><rect x="622" y="319" width="526" height="160" rx="14" fill="#fff" stroke="#dbe5f3"/><rect x="622" y="319" width="6" height="160" rx="3" fill="#30a462"/><text x="650" y="358" fill="#233b5c" font-size="19" font-weight="700">③ 上级：验收通过 / 驳回</text><text x="650" y="391" fill="#687b92" font-size="16">核对交付物、进度和风险记录</text><text x="650" y="421" fill="#687b92" font-size="16">驳回时需明确补齐项；不能自己验收自己的任务</text><rect x="650" y="438" width="116" height="30" rx="7" fill="#e9f8ef"/><text x="670" y="460" fill="#208047" font-size="14" font-weight="700">验收通过</text></g></svg>
