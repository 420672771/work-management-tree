<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="398" viewBox="0 0 1120 398" role="img" aria-labelledby="title desc">
<title id="title">首次登录与飞书绑定</title><desc id="desc">先使用已分配的员工账号，再完成本人密码修改和飞书绑定。。按钮提示未配置时，继续使用账号密码登录，并联系运维人员；不要绑定他人的飞书账号。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5577ac" stroke-width="2"/></marker></defs>
<rect width="1120" height="398" rx="18" fill="#f3f7fe"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="32" y="44" font-size="25" font-weight="700" fill="#17385e">首次登录与飞书绑定</text>
<text x="32" y="76" font-size="16" fill="#536b89">先使用已分配的员工账号，再完成本人密码修改和飞书绑定。</text>
<text x="34" y="124" font-size="17" font-weight="700" fill="#285ca2">首次使用</text>
<rect x="32.0" y="140" width="241.5" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="55.0" cy="166" r="13" fill="#2b65c5"/><text x="55.0" y="171" text-anchor="middle" font-size="15" fill="#fff">1</text>
<text x="77.0" y="172" font-size="19" font-weight="700" fill="#17385e">获取账号</text>
<text x="49.0" y="202" font-size="16" fill="#4d6481">正式地址、本人用户名</text>
<text x="49.0" y="225" font-size="16" fill="#4d6481">初始密码由管理者通知</text>
<path d="M276.5 194H298.5" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="303.5" y="140" width="241.5" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="326.5" cy="166" r="13" fill="#2b65c5"/><text x="326.5" y="171" text-anchor="middle" font-size="15" fill="#fff">2</text>
<text x="348.5" y="172" font-size="19" font-weight="700" fill="#17385e">账号登录</text>
<text x="320.5" y="202" font-size="16" fill="#4d6481">输入账号和密码</text>
<text x="320.5" y="225" font-size="16" fill="#4d6481">登录后核对右上角姓名</text>
<path d="M548.0 194H570.0" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="575.0" y="140" width="241.5" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="598.0" cy="166" r="13" fill="#2b65c5"/><text x="598.0" y="171" text-anchor="middle" font-size="15" fill="#fff">3</text>
<text x="620.0" y="172" font-size="19" font-weight="700" fill="#17385e">修改密码</text>
<text x="592.0" y="202" font-size="16" fill="#4d6481">个人中心 → 修改密码</text>
<text x="592.0" y="225" font-size="16" fill="#4d6481">输入当前密码及两次新密码</text>
<path d="M819.5 194H841.5" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="846.5" y="140" width="241.5" height="108" rx="12" fill="#e9f6ef" stroke="#bfd0e8"/>
<circle cx="869.5" cy="166" r="13" fill="#2b65c5"/><text x="869.5" y="171" text-anchor="middle" font-size="15" fill="#fff">4</text>
<text x="891.5" y="172" font-size="19" font-weight="700" fill="#17385e">绑定飞书</text>
<text x="863.5" y="202" font-size="16" fill="#4d6481">个人中心 → 扫码绑定</text>
<text x="863.5" y="225" font-size="16" fill="#4d6481">以后可使用飞书扫码登录</text>
<rect x="32" y="330" width="1056" height="43" rx="8" fill="#fff6e6"/>
<text x="48" y="358" font-size="16" fill="#805619">按钮提示未配置时，继续使用账号密码登录，并联系运维人员；不要绑定他人的飞书账号。</text></g></svg>