<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="飞书智能助手交互示意">
<rect width="1200" height="560" rx="18" fill="#f4f7fc"/><rect x="166" y="25" width="868" height="510" rx="20" fill="#fff" stroke="#dbe5f3"/><g font-family="Microsoft YaHei,sans-serif"><rect x="166" y="25" width="868" height="78" rx="20" fill="#f7f9fd"/><text x="205" y="72" fill="#19395f" font-size="23" font-weight="700">科技产品中心智能助手</text><text x="205" y="94" fill="#8190a5" font-size="13">已绑定账号后，按发送者对应系统身份控制权限</text><circle cx="211" cy="150" r="20" fill="#2864d7"/><text x="199" y="157" fill="#fff" font-size="14" font-weight="700">刘明</text><rect x="244" y="122" width="310" height="57" rx="13" fill="#dceaff"/><text x="266" y="157" fill="#294466" font-size="17">我有哪些任务？</text><circle cx="988" cy="228" r="20" fill="#78a4da"/><text x="978" y="235" fill="#fff" font-size="14" font-weight="700">AI</text><rect x="515" y="197" width="448" height="88" rx="13" fill="#f1f3f6"/><text x="540" y="231" fill="#28394f" font-size="16" font-weight="700">【我的待办】</text><text x="540" y="260" fill="#465b75" font-size="15">1. #15 本周需求池梳理与优先级确认</text><circle cx="211" cy="344" r="20" fill="#2864d7"/><text x="199" y="351" fill="#fff" font-size="14" font-weight="700">刘明</text><rect x="244" y="316" width="480" height="58" rx="13" fill="#dceaff"/><text x="266" y="351" fill="#294466" font-size="16">把任务#15截止日期改为2026年11月5日</text><circle cx="988" cy="438" r="20" fill="#78a4da"/><text x="978" y="445" fill="#fff" font-size="14" font-weight="700">AI</text><rect x="475" y="402" width="488" height="82" rx="13" fill="#f1f3f6"/><text x="500" y="433" fill="#28394f" font-size="15">将任务#15截止日期由 2026/10/27</text><text x="500" y="458" fill="#28394f" font-size="15">改为 2026/11/05。回复“确认”后执行。</text><rect x="206" y="500" width="783" height="25" rx="10" fill="#f9fbfe" stroke="#dce5f1"/><text x="225" y="518" fill="#9aa8ba" font-size="13">向“科技产品中心智能助手”发送消息或语音…</text></g></svg>
