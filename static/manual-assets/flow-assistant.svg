<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="608" viewBox="0 0 1120 608" role="img" aria-labelledby="title desc">
<title id="title">智能助手：多轮补全，核对后确认</title><desc id="desc">上方展示资料维护和修改任务的确认流程；下方展示新建任务时澄清意图、逐项补全并在网页核对生成的过程。示例为操作示意，并非飞书界面截图。上下文按用户和会话隔离，10分钟内有效。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5577ac" stroke-width="2"/></marker></defs>
<rect width="1120" height="608" rx="18" fill="#f3f7fe"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="32" y="44" font-size="25" font-weight="700" fill="#17385e">智能助手：多轮补全，核对后确认</text>
<text x="32" y="76" font-size="16" fill="#536b89">在飞书打开“科技产品中心智能助手”；示例为对话步骤示意，并非飞书界面截图。</text>
<text x="34" y="124" font-size="17" font-weight="700" fill="#285ca2">维护基础资料 / 修改或删除任务</text>
<rect x="32.0" y="140" width="241.5" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="55.0" cy="166" r="13" fill="#2b65c5"/><text x="55.0" y="171" text-anchor="middle" font-size="15" fill="#fff">1</text>
<text x="77.0" y="172" font-size="19" font-weight="700" fill="#17385e">说明目标</text>
<text x="49.0" y="202" font-size="16" fill="#4d6481">例：新建部门 数据产品部</text>
<text x="49.0" y="225" font-size="16" fill="#4d6481">使用本人已绑定飞书发送</text>
<path d="M276.5 194H298.5" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="303.5" y="140" width="241.5" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="326.5" cy="166" r="13" fill="#2b65c5"/><text x="326.5" y="171" text-anchor="middle" font-size="15" fill="#fff">2</text>
<text x="348.5" y="172" font-size="19" font-weight="700" fill="#17385e">补齐信息</text>
<text x="320.5" y="202" font-size="16" fill="#4d6481">缺少字段时继续补充</text>
<text x="320.5" y="225" font-size="16" fill="#4d6481">重名对象使用 #编号</text>
<path d="M548.0 194H570.0" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="575.0" y="140" width="241.5" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="598.0" cy="166" r="13" fill="#2b65c5"/><text x="598.0" y="171" text-anchor="middle" font-size="15" fill="#fff">3</text>
<text x="620.0" y="172" font-size="19" font-weight="700" fill="#17385e">核对回显</text>
<text x="592.0" y="202" font-size="16" fill="#4d6481">检查对象、人员和字段</text>
<text x="592.0" y="225" font-size="16" fill="#4d6481">有误回复“取消”</text>
<path d="M819.5 194H841.5" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="846.5" y="140" width="241.5" height="108" rx="12" fill="#e9f6ef" stroke="#bfd0e8"/>
<circle cx="869.5" cy="166" r="13" fill="#2b65c5"/><text x="869.5" y="171" text-anchor="middle" font-size="15" fill="#fff">4</text>
<text x="891.5" y="172" font-size="19" font-weight="700" fill="#17385e">确认执行</text>
<text x="863.5" y="202" font-size="16" fill="#4d6481">核对正确后回复“确认”</text>
<text x="863.5" y="225" font-size="16" fill="#4d6481">查看成功提示并核对网页</text>
<text x="34" y="294" font-size="17" font-weight="700" fill="#285ca2">新建任务 / 多轮补全</text>
<rect x="32" y="310" width="241.5" height="150" rx="12" fill="#fff" stroke="#bfd0e8"/>
<text x="50" y="342" font-size="19" font-weight="700" fill="#17385e">1　发送事项</text>
<text x="50" y="376" font-size="16" fill="#4d6481">AI智能客服需求方案</text>
<text x="50" y="404" font-size="16" fill="#4d6481">可先发详情、优先级和时间</text>
<path d="M276.5 385H298.5" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="303.5" y="310" width="241.5" height="150" rx="12" fill="#fff" stroke="#bfd0e8"/>
<text x="321" y="342" font-size="19" font-weight="700" fill="#17385e">2　澄清意图</text>
<text x="321" y="376" font-size="16" fill="#4d6481">助手：新建还是更新？</text>
<text x="321" y="404" font-size="16" fill="#4d6481">回复：这是一条新增任务</text>
<text x="321" y="432" font-size="16" fill="#4d6481">沿用前文，不用重新填写</text>
<path d="M548 385H570" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="575" y="310" width="241.5" height="150" rx="12" fill="#fff" stroke="#bfd0e8"/>
<text x="592" y="342" font-size="19" font-weight="700" fill="#17385e">3　只补缺失信息</text>
<text x="592" y="376" font-size="16" fill="#4d6481">助手：截止日期是什么？</text>
<text x="592" y="404" font-size="16" fill="#4d6481">回复：11月30日</text>
<text x="592" y="432" font-size="16" fill="#4d6481">也可继续纠正人员或优先级</text>
<path d="M819.5 385H841.5" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="846.5" y="310" width="241.5" height="150" rx="12" fill="#e9f6ef" stroke="#bfd0e8"/>
<text x="864" y="342" font-size="19" font-weight="700" fill="#17385e">4　网页核对生成</text>
<text x="864" y="376" font-size="16" fill="#4d6481">确认中心 → 会话任务草稿</text>
<text x="864" y="404" font-size="16" fill="#4d6481">核对标题、人员和日期</text>
<text x="864" y="432" font-size="16" fill="#4d6481">确认生成后进入任务确认流</text>
<path d="M695 466V487H425V466" fill="none" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="518" font-size="16" fill="#4d6481">同一份草稿可以多轮补充；回复“取消”放弃</text>
<rect x="32" y="542" width="1056" height="43" rx="8" fill="#fff6e6"/>
<text x="48" y="570" font-size="16" fill="#805619">资料维护限负责人和管理 PM；助手不会因消息自称管理人员而提权。待补充操作通常 10 分钟内有效。</text></g></svg>
