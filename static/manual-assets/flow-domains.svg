<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
<title id="title">责任域维护：修改同步历史，删除先看引用</title><desc id="desc">入口：组织配置 → 责任域维护。只有负责人和管理 PM 可以维护。。已完成任务、停用模板及删除任务的历史业务记录仍可能构成引用；以系统显示的引用情况为准。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5577ac" stroke-width="2"/></marker></defs>
<rect width="1120" height="750" rx="18" fill="#f3f7fe"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="32" y="44" font-size="25" font-weight="700" fill="#17385e">责任域维护：修改同步历史，删除先看引用</text>
<text x="32" y="76" font-size="16" fill="#536b89">入口：组织配置 → 责任域维护。只有负责人和管理 PM 可以维护。</text>
<text x="34" y="124" font-size="17" font-weight="700" fill="#285ca2">新增与修改</text>
<rect x="32.0" y="140" width="332.0" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="55.0" cy="166" r="13" fill="#2b65c5"/><text x="55.0" y="171" text-anchor="middle" font-size="15" fill="#fff">1</text>
<text x="77.0" y="172" font-size="19" font-weight="700" fill="#17385e">新增责任域</text>
<text x="49.0" y="202" font-size="16" fill="#4d6481">填写名称和上级节点</text>
<text x="49.0" y="225" font-size="16" fill="#4d6481">按需设置负责人及边界</text>
<path d="M367.0 194H389.0" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="394.0" y="140" width="332.0" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="417.0" cy="166" r="13" fill="#2b65c5"/><text x="417.0" y="171" text-anchor="middle" font-size="15" fill="#fff">2</text>
<text x="439.0" y="172" font-size="19" font-weight="700" fill="#17385e">在业务中选择</text>
<text x="411.0" y="202" font-size="16" fill="#4d6481">创建任务、草稿或模板</text>
<text x="411.0" y="225" font-size="16" fill="#4d6481">统一使用责任域编号关联</text>
<path d="M729.0 194H751.0" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="756.0" y="140" width="332.0" height="108" rx="12" fill="#e9f6ef" stroke="#bfd0e8"/>
<circle cx="779.0" cy="166" r="13" fill="#2b65c5"/><text x="779.0" y="171" text-anchor="middle" font-size="15" fill="#fff">3</text>
<text x="801.0" y="172" font-size="19" font-weight="700" fill="#17385e">修改后同步</text>
<text x="773.0" y="202" font-size="16" fill="#4d6481">名称及标签更新到历史</text>
<text x="773.0" y="225" font-size="16" fill="#4d6481">任务状态与统计不会重算</text>
<text x="34" y="300" font-size="17" font-weight="700" fill="#285ca2">删除分支 A：已经被引用</text>
<rect x="32.0" y="316" width="332.0" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="55.0" cy="342" r="13" fill="#2b65c5"/><text x="55.0" y="347" text-anchor="middle" font-size="15" fill="#fff">1</text>
<text x="77.0" y="348" font-size="19" font-weight="700" fill="#17385e">查看引用情况</text>
<text x="49.0" y="378" font-size="16" fill="#4d6481">任务、模板、草稿或下级</text>
<text x="49.0" y="401" font-size="16" fill="#4d6481">历史业务也可能保留引用</text>
<path d="M367.0 370H389.0" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="394.0" y="316" width="332.0" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="417.0" cy="342" r="13" fill="#2b65c5"/><text x="417.0" y="347" text-anchor="middle" font-size="15" fill="#fff">2</text>
<text x="439.0" y="348" font-size="19" font-weight="700" fill="#17385e">停止删除</text>
<text x="411.0" y="378" font-size="16" fill="#4d6481">删除按钮禁用</text>
<text x="411.0" y="401" font-size="16" fill="#4d6481">不能删除后重建来改名</text>
<path d="M729.0 370H751.0" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="756.0" y="316" width="332.0" height="108" rx="12" fill="#e9f6ef" stroke="#bfd0e8"/>
<circle cx="779.0" cy="342" r="13" fill="#2b65c5"/><text x="779.0" y="347" text-anchor="middle" font-size="15" fill="#fff">3</text>
<text x="801.0" y="348" font-size="19" font-weight="700" fill="#17385e">使用修改</text>
<text x="773.0" y="378" font-size="16" fill="#4d6481">保留编号与历史关联</text>
<text x="773.0" y="401" font-size="16" fill="#4d6481">直接更新名称和责任边界</text>
<text x="34" y="476" font-size="17" font-weight="700" fill="#285ca2">删除分支 B：没有任何引用</text>
<rect x="32.0" y="492" width="332.0" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="55.0" cy="518" r="13" fill="#2b65c5"/><text x="55.0" y="523" text-anchor="middle" font-size="15" fill="#fff">1</text>
<text x="77.0" y="524" font-size="19" font-weight="700" fill="#17385e">查看引用情况</text>
<text x="49.0" y="554" font-size="16" fill="#4d6481">核对列表的引用提示</text>
<text x="49.0" y="577" font-size="16" fill="#4d6481">确认没有业务和历史引用</text>
<path d="M367.0 546H389.0" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="394.0" y="492" width="332.0" height="108" rx="12" fill="#fff" stroke="#bfd0e8"/>
<circle cx="417.0" cy="518" r="13" fill="#2b65c5"/><text x="417.0" y="523" text-anchor="middle" font-size="15" fill="#fff">2</text>
<text x="439.0" y="524" font-size="19" font-weight="700" fill="#17385e">点击删除</text>
<text x="411.0" y="554" font-size="16" fill="#4d6481">核对弹窗中的名称</text>
<text x="411.0" y="577" font-size="16" fill="#4d6481">取消则保留原责任域</text>
<path d="M729.0 546H751.0" stroke="#5577ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="756.0" y="492" width="332.0" height="108" rx="12" fill="#e9f6ef" stroke="#bfd0e8"/>
<circle cx="779.0" cy="518" r="13" fill="#2b65c5"/><text x="779.0" y="523" text-anchor="middle" font-size="15" fill="#fff">3</text>
<text x="801.0" y="524" font-size="19" font-weight="700" fill="#17385e">确认删除</text>
<text x="773.0" y="554" font-size="16" fill="#4d6481">该责任域从列表移除</text>
<text x="773.0" y="577" font-size="16" fill="#4d6481">服务端会再次核对引用</text>
<rect x="32" y="682" width="1056" height="43" rx="8" fill="#fff6e6"/>
<text x="48" y="710" font-size="16" fill="#805619">已完成任务、停用模板及删除任务的历史业务记录仍可能构成引用；以系统显示的引用情况为准。</text></g></svg>