<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="问题与需求清单界面示意">
<rect width="1200" height="490" rx="18" fill="#f4f7fc"/><g font-family="Microsoft YaHei,sans-serif"><text x="52" y="55" fill="#173963" font-size="25" font-weight="700">测试问题与需求清单</text><text x="52" y="84" fill="#6c7d92" font-size="15">像表格一样登记；问题和需求都可以提交、修改、删除或关闭。</text><rect x="52" y="114" width="1096" height="317" rx="12" fill="#fff" stroke="#dbe5f3"/><path d="M52 171h1096M52 286h1096M52 364h1096M140 114v317M286 114v317M752 114v317M898 114v317M984 114v317M1060 114v317" stroke="#dbe5f3"/><rect x="52" y="114" width="1096" height="57" rx="12" fill="#edf4ff"/><g fill="#334b70" font-size="15" font-weight="700"><text x="76" y="150">编号</text><text x="164" y="150">类型</text><text x="309" y="150">模块</text><text x="775" y="150">反馈人</text><text x="919" y="150">影响</text><text x="1001" y="150">状态</text><text x="1083" y="150">操作</text></g><g fill="#536880" font-size="15"><text x="77" y="215">新增</text><rect x="158" y="185" width="105" height="44" rx="7" fill="#fff" stroke="#cfdbea"/><text x="178" y="213">问题 ⌄</text><rect x="304" y="185" width="426" height="44" rx="7" fill="#fff" stroke="#cfdbea"/><text x="322" y="213" fill="#9aa8b8">简要描述问题或需求</text><rect x="772" y="185" width="105" height="44" rx="7" fill="#fff" stroke="#cfdbea"/><text x="788" y="213" fill="#9aa8b8">姓名</text><text x="922" y="213">一般</text><text x="999" y="213" fill="#a66b00">待处理</text><rect x="1072" y="185" width="58" height="44" rx="7" fill="#2864d7"/><text x="1084" y="213" fill="#fff" font-weight="700">提交</text><text x="77" y="329">#1</text><text x="164" y="329">需求</text><text x="309" y="329">AI 辅助建单识别多段聊天时，应该…</text><text x="775" y="329">刘明</text><text x="919" y="329">较高</text><text x="999" y="329" fill="#2864d7">处理中</text><text x="77" y="407">#2</text><text x="164" y="407">问题</text><text x="309" y="407">任务标题输入后保存提示不明显</text><text x="775" y="407">钱缘</text><text x="919" y="407">一般</text><text x="999" y="407" fill="#208047">已关闭</text></g><text x="52" y="466" fill="#5e718d" font-size="14">建议附上：测试身份、操作步骤、预期与实际结果、任务/草稿编号和完整截图。</text></g></svg>
