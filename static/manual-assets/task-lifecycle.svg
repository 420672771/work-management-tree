<g font-family="Microsoft YaHei,sans-serif"><rect x="48" y="262" width="1104" height="53" rx="11" fill="#fff" stroke="#dce7f8"/><circle cx="78" cy="289" r="8" fill="#2b69dc"/><text x="98" y="295" fill="#334b70" font-size="16">草稿与待确认任务不进入管理树、任务列表、看板或绩效统计；任务内部可协同，但始终只有一位最终责任人。</text></g></svg>
