<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AI辅助建单流程">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#7592c2"/></marker></defs><rect width="1200" height="300" rx="18" fill="#f7faff"/><g font-family="Microsoft YaHei,sans-serif"><text x="46" y="50" fill="#183b70" font-size="23" font-weight="700">AI 辅助建单：机器提炼，人来决定</text></g><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><path d="M226 155h48M454 155h48M730 155h48M1006 155h48" stroke="#7592c2" stroke-width="3" marker-end="url(#a)"/><g><rect x="40" y="112" width="186" height="86" rx="13" fill="#fff" stroke="#cbdcf5"/><text x="133" y="146" fill="#245db9" font-size="18" font-weight="700">输入或上传材料</text><text x="133" y="173" fill="#66768d" font-size="13">文字 · 截图 · 文档 · 录音</text></g><g><rect x="274" y="112" width="180" height="86" rx="13" fill="#eef6ff" stroke="#a5c6fa"/><text x="364" y="146" fill="#245db9" font-size="18" font-weight="700">AI 提炼待办</text><text x="364" y="173" fill="#66768d" font-size="13">识别安排而非汇报</text></g><g><rect x="502" y="112" width="228" height="86" rx="13" fill="#fff8e8" stroke="#f1ce79"/><text x="616" y="146" fill="#a66b00" font-size="18" font-weight="700">人工核对并编辑草稿</text><text x="616" y="173" fill="#7f6b3d" font-size="13">标题 · 详情 · 人员 · 日期</text></g><g><rect x="778" y="112" width="228" height="86" rx="13" fill="#eefaff" stroke="#9bd7e9"/><text x="892" y="146" fill="#13758b" font-size="18" font-weight="700">确认生成任务</text><text x="892" y="173" fill="#5e718d" font-size="13">进入上级确认流程</text></g><g><rect x="1054" y="112" width="106" height="86" rx="13" fill="#e9f8ef" stroke="#8fcda5"/><text x="1107" y="146" fill="#208047" font-size="18" font-weight="700">生效</text><text x="1107" y="173" fill="#4c7c5f" font-size="13">正式可见</text></g></g><text x="46" y="251" fill="#566f96" font-size="15" font-family="Microsoft YaHei,sans-serif">原则：只生成明确待办；不要把原始整段材料、表情符号或已经汇报完成的结果直接写入任务。</text></svg>
