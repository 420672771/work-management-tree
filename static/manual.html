<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作管理树用户操作手册</title>
  <style>
    :root{--ink:#14213a;--muted:#65738a;--brand:#2864d7;--line:#e5ebf4;--soft:#f5f8fd}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f5f7fb,#eef4fd);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    header{background:linear-gradient(115deg,#0d1d39,#1f5394);color:#fff;padding:32px max(24px,calc((100vw - 1180px)/2));box-shadow:0 5px 20px #10254a2b}header h1{margin:0;font-size:28px;letter-spacing:.2px}header p{margin:4px 0 0;color:#c9daf6}.header-actions{position:absolute;right:max(24px,calc((100vw - 1180px)/2));top:35px;display:flex;gap:10px}.header-actions a,.header-actions button{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:8px;padding:7px 12px;font-size:14px;background:transparent;cursor:pointer;font-family:inherit}
    main{max-width:1180px;margin:30px auto 56px;padding:0 24px}.notice{background:#eef5ff;border:1px solid #cbdcff;border-radius:12px;padding:14px 18px;margin-bottom:18px;color:#285087}.manual{background:#fff;border:1px solid var(--line);border-radius:18px;padding:38px 46px;box-shadow:0 12px 30px #1b37600d}.manual h1{font-size:30px;line-height:1.35;margin:0 0 18px}.manual h2{font-size:23px;margin:42px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}.manual h3{font-size:18px;margin:26px 0 8px}.manual p{margin:10px 0}.manual ul,.manual ol{padding-left:25px}.manual li{margin:4px 0}.manual blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid var(--brand);background:#f4f8ff;color:#46617f}.manual table{width:100%;border-collapse:collapse;margin:14px 0 20px;overflow:hidden;border-radius:10px;border:1px solid var(--line)}.manual th,.manual td{padding:10px 12px;border:1px solid var(--line);text-align:left;vertical-align:top}.manual th{background:var(--soft);font-weight:700}.manual code,.manual pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.manual code{background:#f0f4fa;border-radius:4px;padding:1px 5px;font-size:.9em}.manual pre{background:#0f203d;color:#eef6ff;padding:15px 17px;border-radius:10px;overflow:auto}.loading{padding:42px;text-align:center;color:var(--muted)}
    .manual-figure{margin:20px 0 26px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fbfdff}.manual-figure img{display:block;width:100%;height:auto;border-radius:8px}.manual-figure figcaption{margin:8px 4px 0;color:var(--muted);font-size:13px;text-align:center}
    @media(max-width:720px){header{padding:24px}.header-actions{position:static;margin-top:14px}.manual{padding:24px 20px}.manual th,.manual td{min-width:130px}.manual table{display:block;overflow-x:auto}.manual h1{font-size:25px}main{padding:0 14px;margin-top:16px}}
    .manual-toc{margin:0 0 18px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}.manual-toc summary{cursor:pointer;font-weight:600}#manualToc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 20px;margin-top:12px;max-height:270px;overflow:auto}#manualToc a{color:#285087;text-decoration:none;overflow-wrap:anywhere}#manualToc a:hover{text-decoration:underline}.manual h2,.manual h3{scroll-margin-top:18px}.manual-table{overflow:auto}.manual th,.manual td{overflow-wrap:anywhere}.manual h4{font-size:17px}.manual a{color:var(--brand)}
    @media(max-width:1100px){.header-actions{position:static;margin-top:16px;flex-wrap:wrap}}
    @media(max-width:720px){#manualToc{grid-template-columns:1fr}.header-actions{flex-wrap:wrap}.manual{overflow-wrap:anywhere}}
    @media print{body{background:#fff;font-size:11pt;color:#000}header{background:none;color:#000;padding:0;box-shadow:none}header p,.header-actions,.notice,.manual-toc{display:none!important}main{max-width:none;margin:0;padding:0}.manual{padding:0;border:0;box-shadow:none}.manual h2{break-after:avoid}.manual h3{break-after:avoid}.manual table{font-size:9pt}.manual tr{break-inside:avoid}.manual pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#000;background:#f5f5f5}.manual-figure{break-inside:avoid}.manual th{color:#000}a{color:#000}}
  </style>
</head>
<body>
  <header>
    <h1>工作管理树用户操作手册</h1>
    <p>科技产品中心 · 正式用户操作指引</p>
    <div class="header-actions"><a href="/">返回系统</a><a href="/test-issues">提交问题/需求</a><a href="/manual.md" download="work-management-tree-user-manual.md">下载手册</a><button type="button" onclick="window.print()">打印 / 保存 PDF</button></div>
  </header>
  <main>
    <div class="notice">本手册面向正式用户，含登录、初始密码和各业务场景操作。用户名以管理人员分配的本人账号为准；示例账号不代表已开通账号。需要帮助时，可使用 <a href="/test-issues">问题与需求</a> 提交，相关人员可查看已提交记录并统一跟进。</div>
    <details class="manual-toc" open><summary>操作目录</summary><nav id="manualToc" aria-label="操作手册目录">正在加载目录…</nav></details>
    <article id="manual" class="manual"><div class="loading">正在加载操作手册…</div></article>
  </main>
  <script>
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const inline=s=>escapeHtml(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(text,label,url)=>/^(?:https?:\/\/|\/(?!\/)|#)/i.test(url)?'<a href="'+url+'">'+label+'</a>':label);
    function renderMarkdown(source){
      const lines=source.replace(/\r/g,'').split('\n'),out=[];let i=0,inCode=false,table=[];
      const flushTable=()=>{if(!table.length)return;const rows=table.filter((_,n)=>n!==1).map((row,n)=>row.split('|').slice(1,-1).map(x=>x.trim()));out.push('<div class="manual-table"><table><thead><tr>'+rows[0].map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+row.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');table=[]};
      while(i<lines.length){const line=lines[i];if(line.startsWith('```')){flushTable();inCode=!inCode;out.push(inCode?'<pre><code>':'</code></pre>');i++;continue}if(inCode){out.push(escapeHtml(line)+'\n');i++;continue}if(/^\|.*\|\s*$/.test(line)){table.push(line);i++;continue}flushTable();
        if(!line.trim()){i++;continue}const image=line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);if(image){out.push('<figure class="manual-figure"><img src="'+escapeHtml(image[2])+'" alt="'+escapeHtml(image[1])+'" loading="eager"><figcaption>'+inline(image[1])+'</figcaption></figure>');i++;continue}const h=line.match(/^(#{1,4})\s+(.+)/);if(h){out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);i++;continue}if(line.startsWith('> ')){out.push('<blockquote>'+inline(line.slice(2))+'</blockquote>');i++;continue}
        const ordered=line.match(/^\d+\.\s+(.+)/),bullet=line.match(/^-\s+(.+)/);if(ordered||bullet){const tag=ordered?'ol':'ul',items=[];while(i<lines.length){const m=ordered?lines[i].match(/^\d+\.\s+(.+)/):lines[i].match(/^-\s+(.+)/);if(!m)break;items.push('<li>'+inline(m[1])+'</li>');i++}out.push(`<${tag}>${items.join('')}</${tag}>`);continue}
        out.push('<p>'+inline(line.replace(/  $/,''))+'</p>');i++;
      }flushTable();return out.join('');
    }
    fetch('/manual.md',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('加载失败');return r.text()}).then(text=>{
      document.querySelector('#manual').innerHTML=renderMarkdown(text);
      const toc=document.querySelector('#manualToc');toc.replaceChildren();
      document.querySelectorAll('#manual h2').forEach((heading,index)=>{heading.id='manual-section-'+(index+1);const link=document.createElement('a');link.href='#'+heading.id;link.textContent=heading.textContent;toc.append(link)});
      if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));target?.scrollIntoView();}
    }).catch(()=>{document.querySelector('#manual').innerHTML='<div class="loading">操作手册暂时无法加载，请登录后重试或联系管理 PM。</div>';document.querySelector('#manualToc').textContent='目录暂不可用';});
  </script>
</body>
</html>
