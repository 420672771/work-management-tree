<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作管理树测试问题与需求清单</title>
  <style>
    :root{--ink:#14213a;--muted:#65738a;--brand:#2864d7;--line:#e5ebf4;--soft:#f5f8fd}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{background:linear-gradient(115deg,#0d1d39,#1f5394);color:#fff;padding:25px max(20px,calc((100vw - 1440px)/2));position:relative}header h1{margin:0;font-size:25px}header p{margin:3px 0 0;color:#c9daf6}.links{position:absolute;right:max(20px,calc((100vw - 1440px)/2));top:31px;display:flex;gap:9px}.links a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:7px;padding:6px 11px;font-size:14px}main{max-width:1440px;margin:24px auto;padding:0 20px}.hint{margin:0 0 12px;color:var(--muted)}.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:0 8px 24px #1b37600d}table{width:100%;min-width:1000px;border-collapse:collapse;table-layout:fixed}th,td{padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#edf3fc;color:#334968;font-weight:700;white-space:nowrap}tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}.new-row td{background:#f8fbff}.new-row input,.new-row select{width:100%;border:1px solid #ccd9eb;border-radius:5px;padding:7px;background:#fff;color:var(--ink);font:inherit}.new-row input:focus,.new-row select:focus{outline:2px solid #b9d1f7;border-color:#4b80de}.new-row button{border:0;border-radius:6px;background:var(--brand);color:#fff;padding:7px 11px;font:inherit;font-weight:650;cursor:pointer;white-space:nowrap}.new-row button:disabled{opacity:.6;cursor:wait}.id{color:var(--muted);white-space:nowrap}.tag{padding:2px 7px;border-radius:12px;background:#edf3ff;color:#315eac;font-size:12px;white-space:nowrap}.high{background:#fff1f1;color:#bb3030}.low{background:#f1f7f3;color:#2e7c53}.status{background:#fff8e9;color:#9a6810}.closed{background:#edf6ef;color:#28734b}.empty{text-align:center;color:var(--muted);padding:24px}.message{display:block;max-width:140px;color:#2d6d4e;font-size:13px}.desc{white-space:pre-wrap;overflow-wrap:anywhere}.row-actions{display:flex;gap:6px;align-items:center}.icon-action{border:1px solid #d7e0ef;background:#fff;color:#426188;border-radius:6px;width:30px;height:30px;line-height:1;cursor:pointer;font-size:16px}.icon-action:hover{border-color:#79a0df;color:#1c5fcf}.icon-action.danger{color:#c04a4a}.icon-action.danger:hover{border-color:#efb8b8;background:#fff4f4}.icon-action.done{color:#258253}.icon-action:disabled{opacity:.45;cursor:not-allowed}@media(max-width:720px){header{padding:20px}.links{position:static;margin-top:13px}.sheet{border-radius:6px}main{padding:0 12px;margin-top:16px}}
  </style>
</head>
<body>
  <header><h1>工作管理树测试问题与需求清单</h1><p>在线协作登记表</p><div class="links"><a href="/manual">返回操作手册</a><a href="/">返回系统</a></div></header>
  <main>
    <p class="hint">直接在首行选择“问题”或“需求”后填写并提交。请勿记录访问密码、客户隐私或其他敏感信息。</p>
    <div class="sheet"><table><colgroup><col style="width:5%"><col style="width:8%"><col style="width:12%"><col style="width:35%"><col style="width:10%"><col style="width:7%"><col style="width:6%"><col style="width:8%"><col style="width:9%"></colgroup><thead><tr><th>编号</th><th>类型</th><th>模块</th><th>描述 *</th><th>反馈人</th><th>影响</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="issues"><tr><td class="empty" colspan="9">正在加载…</td></tr></tbody></table></div>
  </main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const labels={high:'高',normal:'一般',low:'低'},states={open:'待处理',processing:'处理中',closed:'已关闭'},types={issue:'问题',requirement:'需求'};
    const cell=(name,placeholder='',type='text')=>`<td><input name="${name}" ${type==='text'?'type="text"':''} placeholder="${placeholder}"></td>`;
    const newRow=()=>`<tr class="new-row"><td class="id">新增</td><td><select name="record_type"><option value="issue">问题</option><option value="requirement">需求</option></select></td><td><select name="module"><option value="">请选择</option><option>登录与身份</option><option>管理树</option><option>任务管理</option><option>确认中心</option><option>AI 会话建单</option><option>飞书智能助手</option><option>组织配置</option><option>数据看板/绩效</option><option>其他</option></select></td>${cell('title','简要描述问题或需求')} ${cell('reporter','姓名')}<td><select name="severity"><option value="normal">一般</option><option value="high">高</option><option value="low">低</option></select></td><td><span class="tag status">待处理</span></td><td class="id">提交后生成</td><td><button type="button" onclick="submitIssue(this)">提交</button><span class="message"></span></td></tr>`;
    const showRow=x=>`<tr data-id="${x.id}"><td class="id">#${x.id}</td><td><span class="tag">${types[x.record_type]||'问题'}</span></td><td>${esc(x.module||'—')}</td><td class="desc">${esc(x.title)}</td><td>${esc(x.reporter||'—')}</td><td><span class="tag ${esc(x.severity)}">${labels[x.severity]||'一般'}</span></td><td><span class="tag ${x.status==='closed'?'closed':'status'}">${states[x.status]||x.status}</span></td><td class="id">${esc(String(x.created_at||'').replace('T',' ').slice(0,16))}</td><td><div class="row-actions"><button class="icon-action" type="button" title="修改" aria-label="修改" onclick="editIssue(${x.id})">✎</button><button class="icon-action done" type="button" title="关闭记录" aria-label="关闭记录" onclick="closeIssue(${x.id})" ${x.status==='closed'?'disabled':''}>✓</button><button class="icon-action danger" type="button" title="删除" aria-label="删除" onclick="deleteIssue(${x.id})">⌫</button></div></td></tr>`;
    const editRow=x=>`<tr class="new-row" data-id="${x.id}"><td class="id">#${x.id}</td><td><select name="record_type">${['issue','requirement'].map(v=>`<option value="${v}" ${v===(x.record_type||'issue')?'selected':''}>${types[v]}</option>`).join('')}</select></td><td><select name="module">${['','登录与身份','管理树','任务管理','确认中心','AI 会话建单','飞书智能助手','组织配置','数据看板/绩效','其他'].map(v=>`<option value="${esc(v)}" ${v===x.module?'selected':''}>${esc(v||'请选择')}</option>`).join('')}</select></td><td><input name="title" value="${esc(x.title)}"></td><td><input name="reporter" value="${esc(x.reporter||'')}"></td><td><select name="severity">${['normal','high','low'].map(v=>`<option value="${v}" ${v===x.severity?'selected':''}>${labels[v]}</option>`).join('')}</select></td><td><span class="tag ${x.status==='closed'?'closed':'status'}">${states[x.status]||x.status}</span></td><td class="id">${esc(String(x.created_at||'').replace('T',' ').slice(0,16))}</td><td><div class="row-actions"><button type="button" onclick="saveIssue(${x.id},this)">保存</button><button class="icon-action" type="button" title="取消" aria-label="取消" onclick="loadIssues()">×</button></div></td></tr>`;
    let issueRows=[];async function loadIssues(){const body=document.querySelector('#issues');try{issueRows=await fetch('/api/test-issues').then(r=>r.ok?r.json():Promise.reject());body.innerHTML=newRow()+issueRows.map(showRow).join('')}catch{body.innerHTML='<tr><td class="empty" colspan="9">加载失败，请刷新页面后重试。</td></tr>'}}
    async function submitIssue(button){const row=button.closest('tr'),data=Object.fromEntries([...row.querySelectorAll('input,select')].map(x=>[x.name,x.value.trim()])),message=row.querySelector('.message');if(!data.title){message.textContent='请填写描述';return}button.disabled=true;message.textContent='提交中…';try{const r=await fetch('/api/test-issues',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(!r.ok)throw Error(out.error||'提交失败');await loadIssues()}catch(error){message.textContent=error.message||'提交失败';button.disabled=false}}
    window.editIssue=id=>{const issue=issueRows.find(x=>x.id===id),row=document.querySelector(`tr[data-id="${id}"]`);if(issue&&row)row.outerHTML=editRow(issue)};
    async function updateIssue(id,data){const r=await fetch(`/api/test-issues/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(!r.ok)throw Error(out.error||'操作失败');return out}
    window.saveIssue=async(id,button)=>{const row=button.closest('tr'),data=Object.fromEntries([...row.querySelectorAll('input,select')].map(x=>[x.name,x.value.trim()]));if(!data.title)return alert('请填写问题描述');button.disabled=true;try{await updateIssue(id,{...data,action:'update'});loadIssues()}catch(error){alert(error.message);button.disabled=false}};
    window.closeIssue=async id=>{if(!confirm('确认关闭该问题吗？关闭后仍保留在清单中。'))return;try{await updateIssue(id,{action:'close'});loadIssues()}catch(error){alert(error.message)}};
    window.deleteIssue=async id=>{if(!confirm('确认删除该问题记录吗？删除后无法恢复。'))return;try{await updateIssue(id,{action:'delete'});loadIssues()}catch(error){alert(error.message)}};
    loadIssues();
  </script>
</body>
</html>
