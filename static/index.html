<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作管理树</title>
<style>
body{font-family:system-ui,-apple-system,"Microsoft Yahei",sans-serif;margin:0;background:#f5f7fb;color:#172033}
header{background:#172b4d;color:white;padding:18px 28px} main{max-width:1200px;margin:24px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border-radius:10px;padding:18px;box-shadow:0 2px 10px #172b4d12;margin-bottom:18px}
h1{margin:0;font-size:22px}h2{font-size:17px;margin-top:0}label{display:block;margin:8px 0 4px;font-size:13px;color:#667085}
input,textarea,select,button{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d0d5dd;border-radius:6px;font:inherit}button{background:#2563eb;color:white;border:0;cursor:pointer;margin-top:10px}.secondary{background:#64748b}
.stats{display:flex;gap:12px}.stat{flex:1;background:#eef4ff;border-radius:8px;padding:12px}.stat b{display:block;font-size:24px}.stat.clickable{cursor:pointer}.stat.clickable:hover{background:#dce9ff}.board-group{margin:18px 0}.board-group h3{font-size:14px;color:#344054;margin:0 0 8px;border-left:3px solid #2563eb;padding-left:8px}.board-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.task{border-left:4px solid #2563eb;padding:12px;background:#f8fafc;border-radius:8px}.overdue{border-color:#dc2626}.task-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.task-actions button{width:auto;display:inline-block;margin:0;padding:6px 9px;font-size:12px}.task-actions .secondary{background:#64748b}
.hidden{display:none!important}.tag{font-size:12px;padding:3px 7px;border-radius:99px;background:#e5e7eb;margin-left:5px}.tree ul{padding-left:22px}.tree li{margin:8px}.tree-toggle{display:inline-block;width:24px;margin:0 5px 0 0;padding:2px 0;background:#e5e7eb;color:#344054;border:0;font-weight:700;line-height:1.2}.tree-children.hidden{display:none}.tree-task{margin:8px 0;padding:8px 10px;border-left:3px solid #2563eb;background:#f8fafc;border-radius:5px;font-size:13px}.tree-task.risk{border-left-color:#dc2626}.muted{color:#667085;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.board-grid{grid-template-columns:1fr}}
.nav-tabs{display:flex;gap:4px;margin-top:14px}.nav-tabs button{width:auto;margin:0;padding:7px 16px;background:transparent;color:#dbe7ff;border:0}.nav-tabs button:hover,.nav-tabs button.active{background:#2f5b9a;color:#fff}
</style></head>
<body><header><h1>科技产品中心 · 工作管理树</h1><div class="muted" style="color:#cbd5e1">唯一责任人 · 任务闭环 · 本地 MVP</div><nav class="nav-tabs"><button id="homeTab" type="button" class="active" onclick="openPage('home')">首页</button><button id="tasksTab" type="button" onclick="openPage('tasks')">任务列表</button><button id="approvalsTab" type="button" onclick="openPage('approvals')">确认中心</button><button id="orgTab" type="button" onclick="openPage('org')">组织配置</button></nav></header>
<main><section id="homePage"><div class="stats" id="stats"></div>
<div class="grid"><section class="card"><h2>管理树</h2><div class="tree" id="tree">加载中…</div></section>
<section class="card"><h2>创建任务</h2><form id="form"><label>任务内容</label><input name="title" required>
<label>挂载责任域</label><select name="org_node_id" id="taskNode" required></select><label>责任人</label><select name="owner_id" id="owners" required></select><label>截止时间</label><input type="datetime-local" name="due_at" required>
<label>交付物/验收标准</label><textarea name="deliverable" required></textarea><label>任务类型</label><select name="task_type"><option value="PROJECT" selected>专项任务</option><option value="ADHOC">临时任务</option></select><label>优先级</label><select name="priority"><option>P0</option><option selected>P1</option><option>P2</option></select><button>创建任务</button></form><p id="msg" class="muted"></p></section></div>
<section class="card"><h2>任务看板（未完结）</h2><div id="boardTasks">加载中…</div></section></section>
<section id="taskPage" class="hidden"><section class="card"><h2>任务列表查询</h2><label for="taskFilter">筛选任务</label><select id="taskFilter"><option value="active">未完结任务</option><option value="completed">已完成任务</option><option value="all">全部任务</option></select><div id="tasks">加载中…</div></section></section></main>
<section id="approvalPage" class="hidden"><main><section class="card"><h2>确认中心</h2><p class="muted">待确认的任务与进度，只有确认后才进入正式统计。</p><div id="approvals">加载中…</div></section></main></section>
<section id="orgPage" class="hidden"><main><section class="card"><h2>组织与汇报线</h2><p class="muted">直属上级决定任务和进度的默认确认人。</p><form id="lineForm"><label>成员</label><select id="lineUser" required></select><label>直属上级</label><select id="lineLeader" required></select><label>审批人（可选，默认直属上级）</label><select id="lineApprover"></select><button>保存汇报关系</button></form><div id="reportingLines"></div></section><section class="card"><h2>例行任务模板</h2><form id="routineForm"><label>模板名称</label><input id="routineTitle" required><label>归属责任域</label><select id="routineNode" required></select><label>责任人</label><select id="routineOwner" required></select><label>交付物</label><input id="routineDeliverable" required><label>周期</label><select id="routineRecurrence"><option value="DAILY">每日</option><option value="WEEKLY">每周一</option></select><button>保存例行模板</button></form><div id="routineTemplates"></div></section></main></section>
<script>
const $=x=>document.querySelector(x); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const dateOnly=s=>{const d=new Date(s);return Number.isNaN(d.getTime())?String(s??''):d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});};
async function get(u){const r=await fetch(u);return r.json()} async function post(u,x){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)})}
async function feedback(id){const percent=Number(prompt('请输入完成百分比（0-100）','0'));if(!Number.isInteger(percent)||percent<0||percent>100)return alert('请输入 0-100 的整数');const comment=prompt('请输入本日进度说明');if(!comment)return;const blocked=confirm('当前是否存在阻塞？');const block_reason=blocked?(prompt('请输入阻塞原因')||'未说明'):'';const expected_finish=prompt('预计完成日期（可留空，YYYY-MM-DD）')||null;const task=currentTasks.find(x=>x.id===id);const r=await post('/api/tasks/'+id+'/progress',{reporter_id:task?.owner_id,percent,comment,blocked,block_reason,expected_finish});if(!r.ok)alert('进度填报失败');else alert('已提交，等待直属上级确认后生效');load()}
async function update(id,status){await post('/api/tasks/'+id,{work_status:status});load()}
async function accept(id,result){let reason=result==='rejected'?prompt('请输入驳回原因')||'未填写原因':'';await post('/api/tasks/'+id+'/accept',{result,acceptor_id:1,reason});load()}
let currentTasks=[]; let currentTaskFilter='active'; let currentUsers=[]; let nodeNames={};
window.openPage=function(page){['home','tasks','approvals','org'].forEach(x=>$('#'+(x==='home'?'homePage':x==='tasks'?'taskPage':x==='approvals'?'approvalPage':'orgPage')).classList.toggle('hidden',page!==x));['home','tasks','approvals','org'].forEach(x=>$('#'+x+'Tab').classList.toggle('active',page===x));if(page==='tasks')renderTaskList();if(page==='approvals')loadApprovals();if(page==='org')loadOrg()};
async function loadApprovals(){const list=await get('/api/approvals');$('#approvals').innerHTML=list.length?list.map(a=>`<div class="task"><b>${esc(a.title||'进度填报')}</b><span class="tag">${esc(a.biz_type)}</span><div class="muted">确认人：${esc(a.approver_name||'未配置')} · 提交：${esc(dateOnly(a.created_at))}${a.reported_percent!==null&&a.reported_percent!==undefined?` · 填报：${a.reported_percent}%`:''}</div>${a.report_text?`<div class="muted">说明：${esc(a.report_text)}${a.is_blocked?` · 阻塞：${esc(a.block_reason)}`:''}</div>`:''}<div class="task-actions"><button onclick="confirmApproval(${a.id},'approved')">确认</button><button class="secondary" onclick="confirmApproval(${a.id},'rejected')">驳回</button></div></div>`).join(''):'暂无待确认事项'}
async function confirmApproval(id,result){const manager=currentUsers.find(x=>x.role==='manager');const reason=result==='rejected'?(prompt('请输入驳回原因')||'未填写原因'):'';const r=await post('/api/approvals/'+id+'/confirm',{result,operator_id:manager?.id,reason});if(!r.ok)alert('处理失败');else load()}
async function loadOrg(){const [lines,templates,tree]=await Promise.all([get('/api/reporting-lines'),get('/api/routine/templates'),get('/api/tree')]);const options=currentUsers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#lineUser').innerHTML=options;$('#lineLeader').innerHTML=options;$('#lineApprover').innerHTML='<option value="">默认直属上级</option>'+options;$('#routineOwner').innerHTML=options;$('#routineNode').innerHTML=tree.filter(x=>x.node_type==='domain').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const by=Object.fromEntries(currentUsers.map(x=>[x.id,x.name]));$('#reportingLines').innerHTML=lines.length?`<h3>当前生效汇报线</h3>${lines.filter(x=>!x.effective_to).map(x=>`<div class="muted">${esc(by[x.user_id]||x.user_id)} → 直属上级：${esc(by[x.direct_leader_id]||x.direct_leader_id)} · 审批人：${esc(by[x.approver_id]||x.approver_id)}</div>`).join('')}`:'暂无汇报线';$('#routineTemplates').innerHTML=templates.length?`<h3>生效模板</h3>${templates.map(x=>`<div class="muted">${esc(x.title)} · ${esc(x.recurrence)} · ${esc(x.owner_name)} · ${esc(x.node_name)}</div>`).join('')}`:'暂无例行模板'}
window.showTaskView=function(filter){currentTaskFilter=filter;$('#taskFilter').value=filter;openPage('tasks');renderTaskList()};
function taskCard(t){return `<div class="task ${t.time_status==='overdue'?'overdue':''}"><b>${esc(t.title)}</b><span class="tag">${esc(t.owner_name)}</span><span class="tag">${esc(t.work_status)}</span><span class="tag">${esc(t.time_status)}</span><div class="muted">截止：${esc(dateOnly(t.due_at))} · 验收：${esc(t.deliverable)}</div>${t.work_status!=='completed'?`<div class="task-actions"><button class="secondary" onclick="feedback(${t.id})">反馈</button><button onclick="update(${t.id},'in_progress')">开始</button><button onclick="accept(${t.id},'passed')">验收</button><button class="secondary" onclick="accept(${t.id},'rejected')">驳回</button></div>`:''}</div>`}
function renderBoard(){const list=currentTasks.filter(t=>t.work_status!=='completed');if(!list.length){$('#boardTasks').innerHTML='暂无未完结任务';return}const groups={};list.forEach(t=>(groups[t.org_node_id]??=[]).push(t));$('#boardTasks').innerHTML=Object.entries(groups).map(([node,tasks])=>`<div class="board-group"><h3>${esc(nodeNames[node]||'未归类责任域')}</h3><div class="board-grid">${tasks.map(taskCard).join('')}</div></div>`).join('')}
function renderTaskList(){const mode=currentTaskFilter;const list=currentTasks.filter(t=>mode==='all'||(mode==='completed'?t.work_status==='completed':t.work_status!=='completed'));$('#tasks').innerHTML=list.length?list.map(taskCard).join(''):'暂无符合条件的任务'}
async function load(){const [d,u,tree,tasks]=await Promise.all([get('/api/dashboard'),get('/api/users'),get('/api/tree'),get('/api/tasks')]);
currentTasks=tasks;currentUsers=u;nodeNames=Object.fromEntries(tree.map(x=>[x.id,x.name]));$('#stats').innerHTML=`<div class="stat clickable" onclick="showTaskView('active')"><b>${d.active}</b>未完结任务</div><div class="stat clickable" onclick="showTaskView('completed')"><b>${d.completed}</b>已完成</div><div class="stat clickable" onclick="openPage('approvals')"><b>${d.pending_approval||0}</b>待确认</div><div class="stat"><b>${d.risk}</b>风险</div>`;
$('#owners').innerHTML=u.filter(x=>x.role!=='manager').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');let by={};tree.forEach(x=>by[x.id]={...x,children:[]});tree.forEach(x=>x.parent_id&&by[x.parent_id]&&by[x.parent_id].children.push(by[x.id]));
const tasksByNode={};tasks.forEach(t=>(tasksByNode[t.org_node_id]??=[]).push(t));
$('#taskNode').innerHTML=tree.filter(x=>x.node_type==='domain').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
function taskMini(t){return `<div class="tree-task ${t.risk_status!=='normal'?'risk':''}"><b>${esc(t.title)}</b><span class="tag">${esc(t.owner_name)}</span><span class="tag">${esc(t.work_status)}</span><div class="muted">截止：${esc(dateOnly(t.due_at))} · ${esc(t.deliverable)}</div></div>`}
window.toggleNode=function(id,button){const box=document.querySelector('#node-'+id+' > .tree-children');if(!box)return;const hidden=box.classList.toggle('hidden');button.textContent=hidden?'+':'−';button.setAttribute('aria-label',hidden?'展开':'折叠')}
function ul(n){const nodeTasks=(tasksByNode[n.id]||[]).map(taskMini).join('');const content=nodeTasks+(n.children.length?`<ul>${n.children.map(ul).join('')}</ul>`:'');const toggle=content?`<button type="button" class="tree-toggle" onclick="toggleNode(${n.id},this)" aria-label="折叠">−</button>`:'';return `<li id="node-${n.id}">${toggle}<b>${esc(n.name)}</b><span class="tag">${esc(n.node_type)}</span>${n.boundary?`<div class="muted">${esc(n.boundary)}</div>`:''}${content?`<div class="tree-children">${content}</div>`:''}</li>`}
$('#tree').innerHTML='<ul>'+tree.filter(x=>!x.parent_id).map(x=>ul(by[x.id])).join('')+'</ul>';
renderBoard();
renderTaskList();
$('#taskFilter').onchange=e=>{currentTaskFilter=e.target.value;renderTaskList()};
$('#lineForm').onsubmit=async e=>{e.preventDefault();const r=await post('/api/reporting-lines',{user_id:Number($('#lineUser').value),direct_leader_id:Number($('#lineLeader').value),approver_id:$('#lineApprover').value?Number($('#lineApprover').value):null});if(!r.ok)alert('保存失败');else {alert('汇报关系已生效');loadOrg()}};
$('#routineForm').onsubmit=async e=>{e.preventDefault();const r=await post('/api/routine/templates',{title:$('#routineTitle').value,org_node_id:Number($('#routineNode').value),owner_id:Number($('#routineOwner').value),deliverable:$('#routineDeliverable').value,recurrence:$('#routineRecurrence').value});if(!r.ok)alert('保存失败');else {e.target.reset();alert('例行模板已保存');loadOrg()}};
$('#form').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.due_at=new Date(x.due_at).toISOString();let r=await post('/api/tasks',x);$('#msg').textContent=r.ok?'任务已创建':'创建失败';if(r.ok){e.target.reset();load()}}} load();
</script></body></html>
